name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Checks, unit and browser tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    env:
      FFMPEG_PATH: /usr/bin/ffmpeg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install FFmpeg (with libass for burned-in captions)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm ci
      - run: npm run check
      - run: npm test
      # Uses the Google Chrome that ships on GitHub's Ubuntu runners.
      - run: npm run test:browser
